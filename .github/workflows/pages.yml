name: Deploy frontend to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VITE_API_MODE: supabase
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate public build configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const fail = () => {
            console.error('Configure a valid HTTPS Supabase URL and sb_publishable_ key in repository variables; secret keys are forbidden.');
            process.exit(1);
          };
          let url;
          try { url = new URL(process.env.VITE_SUPABASE_URL); } catch { fail(); }
          if (url.protocol !== 'https:' || url.username || url.password
            || url.pathname !== '/' || url.search || url.hash
            || !/^sb_publishable_[A-Za-z0-9_-]+$/.test(process.env.VITE_SUPABASE_PUBLISHABLE_KEY ?? '')) fail();
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run check:functions
      - run: npm run test:functions
      - run: npm run build
      - name: Check production adapter and Pages assets
        run: npm run test:production-bundle -- --check-only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed frontend artifact
        id: deployment
        uses: actions/deploy-pages@v4
